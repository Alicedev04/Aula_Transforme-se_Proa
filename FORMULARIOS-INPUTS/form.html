<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 2</title>
  </head>
  <body>
    <form action="" method="post">
      <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">Nome:</label>
        <input
          type="text"
          name="nome"
          id="nome"
          required
          minlength="4"
          maxlength="10"
          placeholder="Digite seu nome"
        />
        <br />
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          required
          minlength="4"
          maxlength="10"
          placeholder="Digite seu E-mail"
        />
        <br />
        <label for="numero">Número:</label>
        <input
          type="number"
          name="numero"
          id="numero"
          step="0.1"
          value=""
          min="0"
          max="10"
          required
        />
        <br />
        <label for="senha">Senha:</label>
        <input
          type="password"
          name="senha"
          id="senha"
          required
          minlength="4"
          maxlength="10"
        />
        <br />
        <label for="check">Aceito os termos?</label>
        <input type="checkbox" name="check" id="check" checked />
        <br />

        <label for="conta">Tipo de conta:</label>
        <input type="radio" name="conta" id="conta" value="poupanca" />
        <label for="conta">Poupança</label>
        <input type="radio" name="conta" id="conta" value="corrente" />
        <label for="conta">Corrente</label>

        <p>
          <input type="submit" value="Enviar" />
          <input type="reset" value="Limpar" />
        </p>
      </fieldset>
    </form>
  </body>
</html>
