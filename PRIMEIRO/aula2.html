<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02- CSS</title>
    <!-- Usando estilos dentro do HTML -->
    <style>
      body {
        background-color: rgb(237, 77, 237);
      }
      h1 {
        text-align: center;
        background-color: rgb(63, 181, 248);
        color: rgb(255, 255, 255);
      }
    </style>
  </head>
  <body>
    <h1>Usando CSS dentro do HTML</h1>
    <h1>Segundo texto</h1>
    <h1>Terceito texto</h1>
    <p
      style="
        color: #fff;
        background-color: rgb(53, 232, 238);
        text-align: center;
      "
    >
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam saepe
      voluptate nemo quidem velit aut odio rerum, exercitationem natus eveniet
      quia neque dolorum dolores? Temporibus atque vitae deleniti. Eius, amet!
    </p>
  </body>
</html>
